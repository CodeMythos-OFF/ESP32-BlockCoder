<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ESP32 Block IDE</title>

    <script src="https://unpkg.com/blockly/blockly.min.js"></script>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

<!-- ========================================================
     HEADER
========================================================= -->

<header class="topbar">

    <div class="brand">

        <div class="brand-icon">
            ESP
        </div>

        <div>

            <div class="brand-title">
                ESP32 Block IDE
            </div>

            <div class="brand-version">
                Version 0.3.4
            </div>

        </div>

    </div>


    <div class="header-actions">

        <div class="connection">

            <span
                id="statusDot"
                class="status-dot"
            ></span>

            <span id="statusText">
                Checking...
            </span>

        </div>


        <select id="port">

            <option value="">
                Select port
            </option>

        </select>


        <button
            class="secondary-button"
            onclick="refreshPorts()"
        >
            ↻
        </button>


        <button class="secondary-button" onclick="saveProject()">Save</button>
        <button class="secondary-button" onclick="document.getElementById('projectFile').click()">Load</button>
        <input id="projectFile" type="file" accept=".json" hidden onchange="loadProject(event)">
        <button
            class="upload-button"
            onclick="uploadProgram()"
        >
            ▶ Upload
        </button>

    </div>

</header>


<!-- ========================================================
     WORKSPACE
========================================================= -->

<main class="workspace">

    <section class="editor-panel">

        <div
            id="blocklyDiv"
        ></div>

    </section>


    <section class="code-panel">

        <div class="panel-header">

            <div class="panel-tabs">

                <button
                    id="codeTab"
                    class="tab active"
                    onclick="showCode()"
                >
                    C++ Code
                </button>

                <button
                    id="outputTab"
                    class="tab"
                    onclick="showOutput()"
                >
                    Output
                </button>

            </div>


            <button
                class="copy-button"
                onclick="copyCode()"
            >
                Copy
            </button>

        </div>


        <div
            id="code"
            class="code-area"
        ></div>


        <pre
            id="output"
            class="output-area hidden"
        >Ready.</pre>

    </section>

</main>


<!-- ========================================================
     TOOLBOX
========================================================= -->

<xml
    id="toolbox"
    style="display:none"
>

    <category
        name="⚡ ESP32"
        colour="#3b82f6"
    >

        <block type="esp_start"></block>

        <block type="esp_gpio"></block>

        <block type="esp_gpio_read"></block>

        <block type="esp_analog_read"></block>

        <block type="esp_pwm"></block>

        <block type="esp_delay"></block>

        <block type="esp_millis"></block>

        <block type="esp_serial_print"></block>

        <block type="esp_serial_println"></block>

    </category>


    <category
        name="🔁 Loops"
        colour="#8b5cf6"
    >

        <block type="controls_repeat"></block>

        <block type="controls_while"></block>

        <block type="controls_for"></block>

        <block type="controls_forever"></block>

    </category>


    <category
        name="❓ Logic"
        colour="#f59e0b"
    >

        <block type="controls_if"></block>

        <block type="logic_compare"></block>

        <block type="logic_operation"></block>

        <block type="logic_negate"></block>

        <block type="logic_boolean"></block>

    </category>


    <category
        name="🔢 Math"
        colour="#10b981"
    >

        <block type="math_number"></block>

        <block type="math_arithmetic"></block>

        <block type="math_modulo"></block>

        <block type="math_random"></block>

    </category>


    <category
        name="🔤 Text"
        colour="#ec4899"
    >

        <block type="text"></block>

    </category>

</xml>


<script src="app.js"></script>

<script>
function saveProject(){
    const data = Blockly.serialization.workspaces.save(workspace);
    const a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:"application/json"}));
    a.download="ESP32_BlockIDE_Project.json";
    a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),500);
}
function loadProject(e){
    const f=e.target.files[0]; if(!f)return;
    const r=new FileReader();
    r.onload=()=>{try{
        Blockly.serialization.workspaces.load(JSON.parse(r.result),workspace);
    }catch(err){alert("Could not load project: "+err);}
    e.target.value="";
    };
    r.readAsText(f);
}
</script>
</body>

</html>
